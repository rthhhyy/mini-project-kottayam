<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">
    <header class="top">
      <h1>Book Tracker</h1>
      <p class="tagline">Keep track of what you want to read, what you are reading, and what you have finished.</p>
    </header>

    <main class="layout">

      <!-- ========== Add a book ========== -->
      <section class="glass add-panel" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a book</h2>

        <form id="book-form" novalidate>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" autocomplete="off" placeholder="e.g. Aadujeevitham" aria-describedby="title-error">
            <p class="error" id="title-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="author">Author</label>
            <input id="author" type="text" autocomplete="off" placeholder="e.g. Benyamin" aria-describedby="author-error">
            <p class="error" id="author-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option>To read</option>
              <option>Reading</option>
              <option>Finished</option>
            </select>
          </div>

          <button type="submit" class="btn-add">Add book</button>
        </form>
      </section>

      <!-- ========== The list ========== -->
      <section aria-labelledby="list-heading">
        <h2 id="list-heading" style="position:absolute;left:-9999px;">Your books</h2>

        <div class="glass summary">
          <p class="counts" id="counts" aria-live="polite"></p>
          <div class="bar" aria-hidden="true">
            <span class="b-finished" id="bar-finished"></span>
            <span class="b-reading" id="bar-reading"></span>
            <span class="b-toread" id="bar-toread"></span>
          </div>
        </div>

        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search by title or author" aria-label="Search by title or author" autocomplete="off">
          <button type="button" class="clear-search" id="clear-search" aria-label="Clear search" hidden>&times;</button>
        </div>

        <ul class="books" id="book-list"></ul>
        <div id="empty"></div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
